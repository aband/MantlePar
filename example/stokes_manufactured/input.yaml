# Run with the shared MantlePar/driver.cpp and schema-v2 input reader.
# All relative paths are resolved from this input.yaml directory.
schema_version: 2

simulation:
  name: stokes_manufactured
  mode: steady

parallel:
  launcher: /home/renpo/system/mpich-install/bin/mpiexec
  ranks: 1
  process_grid: [1, 1]

mesh:
  family: rectangular
  domain:
    x: [0.0, 1.0]
    y: [0.0, 1.0]
  cells: [4, 4]
  perturbation:
    amplitude: 0.15
    seed: 20260916
    boundary_vertices: fixed

quadrature:
  cell_points_per_axis: 5
  edge_points: 5

porosity:
  source: prescribed_function
  prescribed_function:
    name: constant
    parameters:
      value: 0.04
  cell_average: physical_quadrature

boundary_regions:
  physical_endpoint_policy: require_boundary_vertex
  coordinate_tolerance: 1.0e-12
  definitions:
    top:
      side: top
      selector:
        mode: whole_side

flow:
  enabled: true
  system: stokes
  porosity: porosity
  parameters:
    formulation: legacy_rescaled
    theta: 0.0
    # Explicit defaults also used by the driver's manufactured-data validation.
    darcy_compaction_average_cutoff: 1.0e-15
    coupling_average_cutoff: 1.0e-16

  # These named analytic functions are already implemented in driver.cpp.
  forcing:
    stokes:
      name: mms_stokes_force
      parameters: {}
    stokes_pressure_source:
      name: mms_stokes_source
      parameters: {}

  boundary_conditions:
    value_absolute_tolerance: 1.0e-12
    value_relative_tolerance: 1.0e-10
    stokes:
      components: cartesian
      # Left, right and bottom: exact velocity.
      default:
        x:
          type: dirichlet
          value:
            name: mms_stokes_velocity_x
            parameters: {}
        y:
          type: dirichlet
          value:
            name: mms_stokes_velocity_y
            parameters: {}
      # Top: exact traction, overriding the default on this side.
      segments:
        - region: top
          priority: 10
          x:
            type: neumann
            value:
              name: mms_stokes_traction_x
              parameters: {}
          y:
            type: neumann
            value:
              name: mms_stokes_traction_y
              parameters: {}

  linear_system:
    sign_convention: legacy
    pressure_nullspace: none
    project_rhs: false

  solver:
    options_prefix: stokes_manufactured_
    ksp: fgmres
    preconditioner: schur
    relative_tolerance: 1.0e-10
    absolute_tolerance: 1.0e-12
    divergence_tolerance: 1.0e8
    maximum_iterations: 2000
    initial_guess_nonzero: false
    velocity:
      ksp: gmres
      pc: jacobi
      relative_tolerance: 1.0e-12
      absolute_tolerance: 1.0e-14
      divergence_tolerance: 1.0e8
      maximum_iterations: 2000
    pressure:
      ksp: gmres
      pc: none
      relative_tolerance: 1.0e-12
      absolute_tolerance: 1.0e-14
      divergence_tolerance: 1.0e8
      maximum_iterations: 2000
    error_if_not_converged: true
    require_subsolver_convergence: true
    require_true_residual: true
    remove_pressure_nullspace: false

transport:
  enabled: false
phase:
  enabled: false
coupling:
  backend: internal
  internal:
    scheme: single_pass
    update_order: [flow]
restart:
  enabled: false

studies:
  convergence:
    # For one mesh, set this to false AND output.plots.convergence to false.
    enabled: true
    mesh_families: [rectangular, perturbed_quadrilateral]
    levels: 3
    refinement_factor: [2, 2]
    h_measure: maximum_cell_diameter
    reference:
      # The column-reference gravity update does not change this reference.
      source: manufactured
      solution: trigonometric
    errors:
      fields: [stokes_velocity, stokes_pressure_assembled]
      norm: l2
      cell_points_per_axis: 7
      evaluation: common_physical_points

output:
  directory: output/{mesh_family}/level_{level}
  fields:
    format: hdf5_xdmf
    file: fields_{step}.h5
    xdmf_series: fields.xdmf
    parallel_hdf5: true
    quantities: [porosity, stokes_velocity, stokes_pressure_assembled]
  profiles:
    enabled: true
    file: profiles_{step}.csv
    start: [0.5, 0.0]
    end: [0.5, 1.0]
    points: 201
    fields: [stokes_velocity, stokes_pressure_assembled]
  convergence_table: csv
  solver_report: csv
  diagnostics: [true_residual, subsolver_convergence, discrete_mass_balance]
  plots:
    convergence: true
    profiles: true
    formats: [png, pdf]
  schedule:
    steady: after_solve
  save_resolved_input: true
