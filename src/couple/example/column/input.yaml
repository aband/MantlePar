# Startup of a pseudo-1D melting column. All coordinates/time/transport fields
# are nondimensional; material inputs are SI and phase pressure is in Pa.
# Run mantle_couple_init, not the steady-flow mantle_driver executable.
schema_version: 2
simulation:
  name: couple_column_initialization
  mode: transient
parallel:
  launcher: mpiexec
  ranks: 1
  process_grid: [1, 1]
mesh:
  family: rectangular
  domain:
    x: [-0.05, 0.05]
    y: [-0.4, 0.0]
  cells: [2, 40]
  perturbation: {amplitude: 0.15, seed: 20260918, boundary_vertices: fixed}
quadrature:
  cell_points_per_axis: 5
  edge_points: 5

# Startup MFEM coefficients come from phase evaluated on the initial H/C
# profiles at Gauss points. The phi Vec stores their physical cell averages.
porosity:
  source: gauss_point_data
  gauss_point_data:
    provider: runtime_field
    runtime_field: {field: phase_porosity}
  cell_average: physical_quadrature

boundary_regions:
  physical_endpoint_policy: require_boundary_vertex
  coordinate_tolerance: 1.0e-12
  definitions:
    left:   {side: left,   selector: {mode: whole_side}}
    right:  {side: right,  selector: {mode: whole_side}}
    bottom: {side: bottom, selector: {mode: whole_side}}
    top:    {side: top,    selector: {mode: whole_side}}

phase:
  enabled: true
  model: eutectic_rescaled
  parameters:
    Tm0: 2000.0
    Te0: 1480.0
    nu: 6.5e6
    L: 5.0e5
    cp: 1200.0
    Xe: 0.25
    rho: 3000.0
    rhor: 500.0
    mus: 1.0e19
    mul: 1.0
    k0: 1.0e-8
    g: 10.0
    alpha0: 3.0e-5
  pressure:
    model: lithostatic
    surface_y: 0.0

transport:
  enabled: true
  initial_conditions:
    enthalpy:
      name: affine
      parameters: {value: 3.0, origin: [0.0, 0.0], gradient: [0.0, -2.5]}
    composition:
      name: constant
      parameters: {value: 0.04}
  boundary_conditions:
    # Each inflow/outflow decision uses the flow-derived outward normal speed
    # for that transported quantity at that quadrature point.
    enthalpy:
      default: {type: zero_flux}
      segments:
        - {region: bottom, type: inflow_outflow, value: {name: initial}}
        - {region: top, type: inflow_outflow, value: {name: initial}}
    composition:
      default: {type: zero_flux}
      segments:
        - {region: bottom, type: inflow_outflow, value: {name: initial}}
        - {region: top, type: inflow_outflow, value: {name: initial}}
    # Thermal diffusion differentiates T(H,C,P), not H. The prescribed value is
    # T/dT, not kelvin and not an enthalpy value.
    temperature:
      default: {type: zero_flux}
      segments:
        - region: top
          type: prescribed_temperature
          value: {name: constant, parameters: {value: 2.846153846153846}}
  stabilizer:
    type: local_lax_friedrichs
    linearization: full
    # For global_lax_friedrichs, supply global_speed: <nonnegative bound>.
    # No velocity/speed is inferred before the flow solve.
  thermal_diffusion:
    diffusivity: 1.0e-3
    number_of_samples: 4
    extent_fraction: 0.9

flow:
  enabled: true
  system: coupled_stokes_darcy
  porosity: porosity
  parameters:
    formulation: legacy_rescaled
    theta: 0.0
    darcy_compaction_average_cutoff: 1.0e-15
    coupling_average_cutoff: 1.0e-16
  forcing:
    stokes: {name: constant, parameters: {value: [0.0, -1.0]}}
    darcy: {name: constant, parameters: {value: [0.0, 0.0]}}
    stokes_pressure_source: {name: constant, parameters: {value: 0.0}}
    darcy_pressure_source: {name: constant, parameters: {value: 0.0}}
  boundary_conditions:
    value_absolute_tolerance: 1.0e-12
    value_relative_tolerance: 1.0e-10
    stokes:
      components: cartesian
      default:
        x: {type: dirichlet, value: {name: constant, parameters: {value: 0.0}}}
        y: {type: neumann, value: {name: constant, parameters: {value: 0.0}}}
      segments:
        - region: bottom
          y: {type: dirichlet, value: {name: constant, parameters: {value: 0.01}}}
    darcy:
      dirichlet_variable: assembled_normal_velocity
      neumann_variable: pressure_potential
      default: {type: dirichlet, value: {name: constant, parameters: {value: 0.0}}}
      segments:
        - region: top
          type: neumann
          value: {name: constant, parameters: {value: 0.0}}
  linear_system:
    sign_convention: legacy
    pressure_nullspace: none
    project_rhs: false
  solver:
    options_prefix: couple_flow_
    ksp: fgmres
    preconditioner: schur
    relative_tolerance: 1.0e-10
    absolute_tolerance: 1.0e-12
    divergence_tolerance: 1.0e8
    maximum_iterations: 2000
    initial_guess_nonzero: false
    # These legacy blocks are symmetric; CG avoids restarted GMRES stagnation.
    velocity:
      ksp: cg
      pc: jacobi
      relative_tolerance: 1.0e-12
      absolute_tolerance: 1.0e-14
      maximum_iterations: 2000
    pressure:
      ksp: cg
      pc: none
      relative_tolerance: 1.0e-12
      absolute_tolerance: 1.0e-14
      maximum_iterations: 2000
    error_if_not_converged: true
    require_subsolver_convergence: true
    require_true_residual: true
    remove_pressure_nullspace: false

time:
  start: 0.0
  end: 0.1
  maximum_steps: 10000
  step: {control: fixed, initial: 1.0e-4, minimum: 1.0e-8, maximum: 1.0e-3, cfl: 0.5}
coupling:
  backend: internal
  internal:
    scheme: single_pass
    update_order: [phase, flow, transport]
restart: {enabled: false}
output:
  directory: output/{mesh_family}
  save_resolved_input: true
